_version = 1

suggestion.not-found = "verifique se o caminho do arquivo existe e está escrito corretamente"
suggestion.similar-paths = "o caminho não existe; estes são os nomes mais próximos: %{paths}"
suggestion.permission-denied = "verifique as permissões do arquivo ou execute com privilégios apropriados"
suggestion.disk-full = "libere espaço em disco e repita a operação"
suggestion.quota-exceeded = "verifique a cota de disco e libere espaço"
suggestion.cross-device = "garanta que origem e destino estejam no mesmo sistema de arquivos"
suggestion.io = "inspecione o erro de E/S subjacente: %{source}"
suggestion.config-invalid = "corrija a chave de configuração citada em `message`, ou rode `atomwrite config list` para ver as chaves em vigor"
suggestion.feature-missing = "este binário foi compilado sem essa feature opcional; recompile com a feature citada em `message`, ou use um verbo que este build já traz (`atomwrite agent-surface` lista todos)"
suggestion.workspace-jail-inside = "use um caminho dentro do workspace (%{workspace}); para --old-file/--new-file estagie em %{workspace}/.atomwrite/scratch/ (nunca /tmp do SO fora do jail)"
suggestion.workspace-jail-set = "repita com --workspace '%{root}' (a pasta de %{name}): atomwrite --workspace '%{root}' read '%{name}'"
suggestion.workspace-jail-content-source = "caminho de content-source saiu do jail; estagie --old-file/--new-file em %{workspace}/.atomwrite/scratch/ e repita (não use /tmp fora de --workspace)"
suggestion.symlink-blocked = "use --follow-symlinks ou resolva o symlink manualmente"
suggestion.state-drift = "releia o arquivo para obter o checksum atual e repita"
suggestion.checksum-verify = "releia o arquivo para obter o checksum atual"
suggestion.file-too-large = "use --max-filesize para aumentar o limite ou processe arquivos menores"
suggestion.immutable-path = "remova o atributo imutável (chattr -i no Unix, fsutil no Windows) de %{path}"
suggestion.binary-file = "conteúdo binário detectado; use read --stat só para metadados ou read --format raw para emitir bytes brutos sem envelope JSON"
suggestion.skip-special = "ignore este arquivo ou use redirecionamento de stdin"
suggestion.no-matches = "amplie o padrão de busca; verifique filtros --include / --exclude; confira o conteúdo do arquivo"
suggestion.all-skipped-binary = "todos os arquivos visitados foram pulados; use --binary ou aumente --max-filesize, ou troque o alvo"
suggestion.match-ambiguous = "aumente o contexto do casamento (apply: uma linha do SEARCH; edit: --old) ou troque todas as ocorrências (--all no apply, --replace-all no edit)"
suggestion.match-failed = "inspecione best_candidate no NDJSON de erro e aumente o contexto do casamento (apply: linhas do SEARCH; edit: --old), ou reduza --fuzzy-threshold"
suggestion.read-no-comments-number = "some --number para cada linha manter o número do arquivo; --no-comments tira linhas, e renumerar quebraria o próximo apply"
suggestion.match-failed-apply = "inspecione best_candidate no NDJSON de erro e aumente o contexto do SEARCH, ou troque para --format unified para escrever o contexto uma vez só"
suggestion.cancelled = "operação cancelada por sinal; tente novamente após inspecionar journal/limpeza de temp"
suggestion.internal-error = "isto é um bug; reporte com o contexto de `message`"
suggestion.edit-pair-failed = "o par %{index} não correspondeu; corrija o par, tente com --fuzzy aggressive, ou passe --partial para aplicar os pares válidos e reportar o restante"
suggestion.invalid-input = "confira os argumentos e o conteúdo de entrada; `message` diz o que foi recusado. Num manifesto de regras ele também diz se falhou a sintaxe do YAML ou o esquema, e qual campo está errado"
suggestion.fuzzy-content-cap = "o arquivo passa do limite de tamanho do fuzzy, então a cascata fuzzy não rodou; aumente `[fuzzy].max_content_bytes` (por exemplo `atomwrite config set fuzzy.max_content_bytes <BYTES> --scope global`) ou use `--fuzzy off` para busca exata"
suggestion.fuzzy-pattern-cap = "o padrão passa do limite de tamanho do fuzzy; encurte o bloco ou use um trecho único menor, ou use `--fuzzy off` para busca exata"
suggestion.lock-timeout = "outro processo está escrevendo em %{path} (esperou %{timeout_ms} ms); aguarde ele terminar e repita o comando"
suggestion.syntax-error = "verificação de sintaxe pós-escrita encontrou %{count} erro(s) de sintaxe em %{path}; inspecione o conteúdo (ou desabilite com --no-syntax-check no apply) e tente novamente"
suggestion.exdev-fallback-disabled = "--strict-atomic recusou a única escrita possível para %{path} (veja `message`: rename cross-device ou inode que precisa ser preservado). Retire --strict-atomic, ou escreva um caminho que possa ser trocado por rename"
suggestion.copy-back-blake3-failed = "verificação BLAKE3 após escrita in-place falhou para %{path}; o arquivo no disco pode estar parcialmente escrito. Inspecione manualmente antes de tentar novamente."
suggestion.orphan-journal = "uma execução anterior do atomwrite travou e deixou o journal %{journal} (veja `message`). Inspecione o arquivo alvo e o journal manualmente, depois apague %{journal} quando o arquivo estiver no estado esperado"
suggestion.merge-conflict = "resolva manualmente as %{count} região(ões) em conflito em %{path}, ou repita sem --fail-on-conflict para gravar o resultado do merge com marcadores"
suggestion.edit-loop-partial = "%{unmatched} de %{total} par(es) não corresponderam; os pares que casaram foram gravados. Corrija os pares sem correspondência e repita, ou retire --partial para abortar o lote inteiro quando um par não casa"
suggestion.doctor-checks-failed = "%{failed} verificação(ões) falharam e %{warned} deram aviso; leia o array `checks` do evento doctor_report, corrija o host (permissões, disco, configuração) e repita, ou retire --strict para tolerar avisos"
suggestion.prune-backups-directory = "nomeie os arquivos cujos backups serão podados, ou passe --recursive para varrer a árvore do diretório"
suggestion.confirm-side-effect-without-side-effect = "retire --confirm-side-effect neste verbo; a flag existe só para os verbos que mudam bytes em disco, e `commands --include-globals` lista quais são"
suggestion.language-extension-mismatch = "passe -l com a linguagem que o arquivo realmente é, ou nomeie arquivos cuja extensão case com a linguagem pedida; a extensão decide a gramática"
suggestion.single-target = "este verbo responde por um arquivo por invocação; informe exatamente um alvo, ou passe --format raw para concatenar vários arquivos"
suggestion.read-multi-target = "flag que recorta um arquivo (--lines, --line, --context, --head, --tail, --grep, --stat, --verify-checksum) aceita um alvo só; rode o verbo uma vez por arquivo, ou tire a flag para concatenar com --format raw"
suggestion.join-input = "--join CHAVE:SUFIXO lê do stdin uma tabela NDJSON de objetos: envie-a por pipe (nunca um terminal), mantenha abaixo do limite de tamanho, dê a cada chave um valor string em pelo menos uma linha e use um comando que não leia o stdin (search, list, count, ...)"
suggestion.missing-flag = "repita com %{flag}"
suggestion.unsupported-combination = "remova %{flag} ou %{other} e repita"
suggestion.transaction-rollback-failed = "a árvore pode estar parcialmente revertida (veja `message`); NÃO repita às cegas — inspecione os sidecars .atomwrite.journal no workspace e reconcilie cada arquivo à mão antes de rodar qualquer outra coisa"
suggestion.grammar-unavailable = "a gramática de %{language} não está nesta máquina (veja `message`). Rode o verbo uma vez por idioma enquanto a rede estiver acessível — o pacote baixa a gramática para o cache no primeiro uso — e repita; o `atomwrite doctor` informa quais gramáticas já estão em cache"

warn.write-risk = "risco de escrita: %{level} (%{delta_pct}% de delta, %{original} -> %{new_bytes} bytes)"
suggestion.config-out-of-range = "o valor está fora da faixa que esta chave aceita; use um valor dentro da faixa indicada em `message` e rode `atomwrite config get CHAVE` para ver o valor atual e o padrão"
suggestion.config-relation = "duas chaves de configuração se contradizem; baixe a primeira ou suba a segunda para que fiquem de acordo, como `message` indica"
warn.config-layer-unreadable = "arquivo de configuração ignorado, não é TOML válido ou não pôde ser lido: %{reason}"
warn.config-other-problems = "%{path} tem outros problemas que foram deixados como estão: %{reason}"
warn.config-storage-home = "storage.home muda o diretório de configuração: as chaves globais agora são lidas de %{path} e o arquivo antigo não é movido"

cancel.shutting-down = "atomwrite: encerrando (shutting down)..."
cancel.timeout-elapsed = "atomwrite: prazo global esgotado (global timeout elapsed, exit 124)"

feature.ast-required = "%{command} exige a feature `ast`; recompile com: cargo install atomwrite --features ast (já incluída nas features padrão)"
