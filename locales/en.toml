_version = 1

suggestion.not-found = "verify the file path exists and is spelled correctly"
suggestion.permission-denied = "check file permissions or run with appropriate privileges"
suggestion.disk-full = "free disk space and retry the operation"
suggestion.quota-exceeded = "check disk quota and free space"
suggestion.cross-device = "ensure source and destination are on the same filesystem"
suggestion.io = "inspect the underlying I/O error: %{source}"
suggestion.config-invalid = "fix the configuration key named in `message`, or run `atomwrite config list` to see the effective keys"
suggestion.feature-missing = "this binary was built without that optional feature; rebuild it with the feature named in `message`, or use a verb this build already carries (`atomwrite agent-surface` lists them)"
suggestion.workspace-jail-inside = "use a path inside the workspace (%{workspace}); for --old-file/--new-file stage under %{workspace}/.atomwrite/scratch/ (never OS /tmp outside the jail)"
suggestion.workspace-jail-set = "set --workspace <root> (XDG/config only; no environment variables)"
suggestion.workspace-jail-content-source = "content-source path escaped the jail; stage --old-file/--new-file under %{workspace}/.atomwrite/scratch/ then re-run (do not use /tmp outside --workspace)"
suggestion.symlink-blocked = "use --follow-symlinks or resolve the symlink manually"
suggestion.state-drift = "re-read the file to get the current checksum and retry"
suggestion.checksum-verify = "re-read the file to get current checksum"
suggestion.file-too-large = "use --max-filesize to increase the limit or process smaller files"
suggestion.immutable-path = "remove the immutable attribute (chattr -i on Unix, fsutil on Windows) from %{path}"
suggestion.binary-file = "binary content detected; use read --stat for metadata only or use read --format raw to emit raw bytes without JSON envelope"
suggestion.skip-special = "skip this file or use stdin redirection instead"
suggestion.no-matches = "broaden the search pattern; check --include / --exclude filters; verify the file content"
suggestion.match-ambiguous = "narrow --old with more surrounding context or pass --replace-all"
suggestion.match-failed = "inspect best_candidate in the error NDJSON and adjust --old, or lower --fuzzy-threshold"
suggestion.cancelled = "operation cancelled by signal; retry after inspecting journal/temp cleanup"
suggestion.internal-error = "this is a bug; please report it with the context in `message`"
suggestion.edit-pair-failed = "pair %{index} did not match; fix that pair, retry with --fuzzy aggressive, or pass --partial to apply the matching pairs and report the rest"
suggestion.invalid-input = "check the arguments and the input content; `message` states what was rejected. For a rules manifest it also states whether the YAML syntax or the schema failed, and which field is wrong"
suggestion.fuzzy-content-cap = "the file is above the fuzzy size limit, so the fuzzy cascade did not run; raise `[fuzzy].max_content_bytes` (for example `atomwrite config set fuzzy.max_content_bytes <BYTES> --scope global`) or pass `--fuzzy off` for exact-only matching"
suggestion.fuzzy-pattern-cap = "the pattern is above the fuzzy size limit; shorten the block or use a smaller unique slice, or pass `--fuzzy off` for exact-only matching"
suggestion.lock-timeout = "another process is writing to %{path} (waited %{timeout_ms} ms); wait for it to finish and run the command again"
suggestion.syntax-error = "post-write syntax check found %{count} syntax error(s) in %{path}; inspect the content (or disable with --syntax-check=false) and retry"
suggestion.exdev-fallback-disabled = "--strict-atomic refused the only write available for %{path} (see `message`: cross-device rename or an inode that must be preserved). Drop --strict-atomic, or write a path that can be replaced by rename"
suggestion.copy-back-blake3-failed = "BLAKE3 verification after in-place write failed for %{path}; the on-disk file may be partially written. Inspect manually before retrying."
suggestion.orphan-journal = "a previous atomwrite run crashed and left journal %{journal} (see `message`). Manually inspect the target file and the journal, then delete %{journal} once the file is in the expected state"
suggestion.merge-conflict = "resolve the %{count} conflicting region(s) in %{path} by hand, or re-run without --fail-on-conflict to write the marked merge result"
suggestion.edit-loop-partial = "%{unmatched} of %{total} pair(s) did not match; the matching pairs were written. Fix the unmatched pairs and re-run, or drop --partial to abort the whole batch when a pair misses"
suggestion.doctor-checks-failed = "%{failed} check(s) failed and %{warned} warned; read the `checks` array of the doctor_report event, fix the host (permissions, disk, config) and re-run, or drop --strict to tolerate warnings"
suggestion.prune-backups-directory = "name the files whose backups are pruned; a directory is not a backup subject, and pruning never walks a tree"
suggestion.confirm-side-effect-without-side-effect = "drop --confirm-side-effect on this verb; the flag is only for the verbs that change bytes on disk, and `commands --include-globals` lists them"
suggestion.language-extension-mismatch = "pass -l with the language the file actually is, or name files whose extension matches the requested language; the extension decides the grammar"
suggestion.single-target = "this verb answers for one file per invocation; name exactly one target, or pass --format raw to concatenate several files"
suggestion.read-multi-target = "a flag that carves one file (--lines, --line, --context, --head, --tail, --grep, --stat, --verify-checksum) takes a single target; run the verb once per file, or drop the flag to concatenate with --format raw"
suggestion.join-input = "--join KEY:SUFFIX reads an NDJSON table of objects from stdin: pipe it in (never a terminal), keep it under the size limit, give every key a string value in at least one row, and use a command that does not read stdin itself (search, list, count, ...)"
suggestion.missing-flag = "re-run with %{flag}"
suggestion.unsupported-combination = "drop %{flag} or %{other} and re-run"
suggestion.transaction-rollback-failed = "the tree may be partially reverted (see `message`); do NOT retry blindly — inspect the .atomwrite.journal sidecars under the workspace and reconcile each file by hand before running anything else"
suggestion.grammar-unavailable = "the grammar for %{language} is not on this host (see `message`). Run the verb once per language while the network is reachable — the pack downloads the grammar into its cache on first use — then re-run; `atomwrite doctor` reports which grammars are already cached"

warn.write-risk = "write risk: %{level} (%{delta_pct}% delta, %{original} -> %{new_bytes} bytes)"
suggestion.config-out-of-range = "the value is outside the range this key accepts; use a value inside the range stated in `message`, and run `atomwrite config get KEY` to see the current value and the default"
suggestion.config-relation = "two config keys contradict each other; lower the first key or raise the second one so that they agree, as `message` states"
warn.config-layer-unreadable = "config file skipped, it is not valid TOML or cannot be read: %{reason}"
warn.config-other-problems = "%{path} has other problems that were left untouched: %{reason}"
warn.config-storage-home = "storage.home relocates the config directory: global keys are now read from %{path} and the old file is not moved"

cancel.shutting-down = "atomwrite: shutting down..."
cancel.timeout-elapsed = "atomwrite: global timeout elapsed (exit 124)"

feature.ast-required = "%{command} requires the `ast` feature; rebuild with: cargo install atomwrite --features ast (included in the default features)"
